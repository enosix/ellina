<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom CloudUI Demo</title>
  <style>
    body { font: 16px system-ui; margin: 32px; color: #222; }
    main { max-width: 640px; padding: 24px; border: 1px solid #ddd;
           border-radius: 12px; }
    button { padding: 10px 18px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 16px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Material Request Preview</h1>
    <p id="status">Waiting for the portal connection…</p>
    <p>Material: <strong id="material">—</strong></p>
    <p>Quantity: <strong id="quantity">—</strong></p>
    <h2>Launch information</h2>
    <pre id="details">{}</pre>
    <button id="close" disabled>Close</button>
  </main>

  <script>
    const portalOrigin = "https://arnold-dev-pr-503.azurewebsites.net";
    let port;

    function send(subject, data = {}) {
      port?.postMessage({
        id: crypto.randomUUID(),
        time: Date.now(),
        subject,
        source: "cloud-ui",
        specVersion: "1.0",
        type: "object",
        dataContentType: "application/json",
        data
      });
    }

    window.addEventListener("message", event => {
      if (event.source !== window.parent ||
          event.origin !== portalOrigin ||
          event.data !== "iframeReady:cloud-ui:host" ||
          !event.ports[0] || port) return;

      port = event.ports[0];
      port.onmessage = message => {
        const envelope = message.data;
        if (envelope?.source !== "host" ||
            envelope.subject !== "INITIAL-CONTEXT") return;

        const context = envelope.data ?? {};
        const settings = context.AppSettings ?? {};
        const transaction = context.TransactionData ?? {};

        document.getElementById("title").textContent =
          settings.title ?? "Material Request Preview";
        document.getElementById("material").textContent =
          transaction.material ?? settings.defaultMaterial ?? "Not supplied";
        document.getElementById("quantity").textContent =
          transaction.quantity ?? settings.defaultQuantity ?? "Not supplied";
        document.getElementById("status").textContent =
          "Connected successfully. Initial context received.";

        // Deliberately do not display authentication tokens or API keys.
        document.getElementById("details").textContent =
          JSON.stringify({
            AppSettings: settings,
            TransactionData: transaction
          }, null, 2);
        document.getElementById("close").disabled = false;
      };

      send("CHANNEL-READY");
    });

    document.getElementById("close").onclick = () => send("CANCEL");
  </script>
</body>
</html>
