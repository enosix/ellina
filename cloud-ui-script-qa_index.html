<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud UI Script QA</title>
  <style>
    body { font: 16px system-ui; margin: 24px; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 16px;
      background: #f3f4f6;
      border: 1px solid #ccc;
    }
    button { padding: 10px 16px; }
  </style>
</head>
<body>
  <h1>Cloud UI Script QA</h1>
  <p id="status">Waiting for host handshake…</p>
  <button id="cancel" disabled>Cancel and return to chat</button>
  <h2>Received context — Api values redacted</h2>
  <pre id="output"></pre>

  <script>
    "use strict";

    const statusElement = document.getElementById("status");
    const outputElement = document.getElementById("output");
    const cancelButton = document.getElementById("cancel");

    const hostParameter = new URLSearchParams(location.search).get("host");
    let expectedHostOrigin = null;
    let port = null;

    try {
      expectedHostOrigin = new URL(hostParameter).origin;
    } catch {
      statusElement.textContent =
        "Configuration error: add ?host=<URL-encoded portal origin>.";
    }

    function send(subject, data = {}) {
      if (!port) return;
      port.postMessage({
        id: crypto.randomUUID(),
        time: Date.now(),
        subject,
        source: "qa-test-app",
        specVersion: "1.0",
        type: "object",
        dataContentType: "application/json",
        data
      });
    }

    window.addEventListener("message", event => {
      if (!expectedHostOrigin || port) return;
      if (event.source !== window.parent) return;
      if (event.origin !== expectedHostOrigin) return;
      if (event.data !== "iframeReady:cloud-ui:host") return;
      if (!event.ports || !event.ports[0]) return;

      port = event.ports[0];

      port.onmessage = messageEvent => {
        const message = messageEvent.data;
        if (!message || message.subject !== "INITIAL-CONTEXT") return;

        const context = message.data;
        if (!context || typeof context !== "object" || Array.isArray(context)) {
          statusElement.textContent = "FAIL: context is not an object.";
          return;
        }

        const visible = {};
        for (const key of Object.keys(context)) {
          if (key !== "Api") visible[key] = context[key];
        }

        const api = context.Api;
        visible.ApiSummary = {
          present: !!api && typeof api === "object",
          baseUrlPresent: typeof api?.BaseURL === "string" &&
                          api.BaseURL.length > 0,
          tokenPresent: typeof api?.Authorization?.Token === "string" &&
                        api.Authorization.Token.length > 0,
          apiKeyPresent: typeof api?.ApiKey === "string" &&
                         api.ApiKey.length > 0,
          connectionIdPresent: typeof api?.ConnectionId === "string",
          keys: api && typeof api === "object" ? Object.keys(api) : []
        };

        outputElement.textContent = JSON.stringify(visible, null, 2);
        statusElement.textContent = "PASS: INITIAL-CONTEXT received.";
        cancelButton.disabled = false;
      };

      port.start();
      statusElement.textContent = "Channel connected; waiting for context…";
      send("CHANNEL-READY");
    });

    cancelButton.addEventListener("click", () => send("CANCEL"));
  </script>
</body>
</html>
